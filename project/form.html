<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Review</title>
  <meta name="description" content="Submit a product review for the WDD 131 project." />
  <link rel="stylesheet" href="styles/base.css" />
  <script src="scripts/form.js" defer></script>
</head>

<body>
  <header>
    <h1>Product Review</h1>

    <nav>
      <ul class="nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="form.html">Review Form</a></li>
        <li><a href="review.html">Submitted Reviews</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <form action="review.html" method="get">
      <label for="product">Product Name *</label>
      <select id="product" name="product" required>
        <option value="">Select a product...</option>
      </select>

      <!-- Visible JS output (template literal output target) -->
      <p id="status" class="status" aria-live="polite"></p>

      <fieldset>
        <legend>Overall Rating *</legend>
        <label><input type="radio" name="rating" value="1" required> 1</label>
        <label><input type="radio" name="rating" value="2"> 2</label>
        <label><input type="radio" name="rating" value="3"> 3</label>
        <label><input type="radio" name="rating" value="4"> 4</label>
        <label><input type="radio" name="rating" value="5"> 5</label>
      </fieldset>

      <label for="installDate">Date of Installation *</label>
      <input type="date" id="installDate" name="installDate" required>

      <fieldset>
        <legend>Useful Features</legend>
        <label><input type="checkbox" name="features" value="Durability"> Durability</label>
        <label><input type="checkbox" name="features" value="Ease of Use"> Ease of Use</label>
        <label><input type="checkbox" name="features" value="Performance"> Performance</label>
        <label><input type="checkbox" name="features" value="Design"> Design</label>
      </fieldset>

      <label for="review">Written Review</label>
      <textarea id="review" name="review" rows="5"></textarea>

      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" autocomplete="name">

      <button type="submit">Submit Review</button>
    </form>
  </main>

  <footer>
    <p>© <span id="year"></span> Karolina Lym</p>
  </footer>
</body>
</html>
